<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archit Kumar — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-line:#e4e0d3;
    --ink:#182126;
    --ink-soft:#4b545a;
    --teal:#0e5257;
    --teal-deep:#0a3d40;
    --gold:#c07f22;
    --card:#fffdf8;
    --rule:#d8d3c3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14181a;
      --paper-line:#1f2528;
      --ink:#ece7db;
      --ink-soft:#a9b0ac;
      --teal:#5fb8ba;
      --teal-deep:#8fd2d1;
      --gold:#e0a94c;
      --card:#191f21;
      --rule:#2b3235;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181a;
    --paper-line:#1f2528;
    --ink:#ece7db;
    --ink-soft:#a9b0ac;
    --teal:#5fb8ba;
    --teal-deep:#8fd2d1;
    --gold:#e0a94c;
    --card:#191f21;
    --rule:#2b3235;
  }

  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior:smooth;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 42px,
      var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--teal-deep); }

  .wrap{ max-width:920px; margin:0 auto; padding:0 28px; }

  header.top{
    position:sticky; top:0; z-index:20;
    backdrop-filter:saturate(140%) blur(6px);
    background:color-mix(in srgb, var(--paper) 82%, transparent);
    border-bottom:1px solid var(--rule);
  }
  header.top .bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
    max-width:920px; margin:0 auto;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  header.top .mark{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px; letter-spacing:.02em; color:var(--teal);
  }
  header.top nav{ display:flex; gap:22px; font-family:"IBM Plex Mono", monospace; font-size:12.5px; }
  header.top nav a{ color:var(--ink-soft); text-decoration:none; }
  header.top nav a:hover, header.top nav a:focus-visible{ color:var(--teal); }

  /* ---------- HERO ---------- */
  .hero{ padding:76px 0 30px; }
  .hero .kicker{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px; color:var(--ink-soft);
    margin:0 0 18px;
  }
  .hero h1{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(48px, 9vw, 92px);
    line-height:.98;
    letter-spacing:-.01em;
    margin:0 0 22px;
    color:var(--ink);
  }
  .hero p.lede{
    max-width:56ch;
    font-size:18.5px;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .hero .contact-row{
    display:flex; flex-wrap:wrap; gap:16px 26px;
    margin-top:26px;
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
  }
  .hero .contact-row a{ color:var(--teal-deep); text-decoration:none; border-bottom:1px solid currentColor; }
  .hero .contact-row span{ color:var(--ink-soft); }

  /* ---------- ROUTE / JOURNEY VISUAL ---------- */
  .route{ padding:8px 0 56px; }
  .route-scroll{ overflow-x:auto; overflow-y:hidden; padding-bottom:6px; }
  .route svg{ display:block; min-width:760px; width:100%; height:auto; }
  .route-path{
    fill:none; stroke:var(--teal); stroke-width:2;
    stroke-dasharray:4 7; stroke-linecap:round;
    stroke-dashoffset:900; opacity:0;
    animation:draw 1.6s ease-out .2s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; opacity:1; } }
  .node circle{ fill:var(--paper); stroke:var(--teal); stroke-width:2; }
  .node.milestone circle{ fill:var(--gold); stroke:var(--gold); }
  .node text.label{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; fill:var(--ink); }
  .node text.date{ font-family:"IBM Plex Mono", monospace; font-size:10px; fill:var(--ink-soft); }
  @media (prefers-reduced-motion: reduce){
    .route-path{ animation:none; stroke-dashoffset:0; opacity:1; }
  }

  section{ padding:54px
